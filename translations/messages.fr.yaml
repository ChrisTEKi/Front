        title: "Questions fréquemment posées par les vendeurs"
        subtitle: "Tout ce que vous devez savoir avant de commencer sur GoBuy"
        q1: "Quels sont les frais pour ouvrir ma boutique sur GoBuy ?"
        a1: "Avec la Formule Standard, l'inscription est 100% gratuite et sans aucun loyer mensuel (0 Ar/mois). Vous ne payez une commission que lorsqu'une vente est effectivement conclue et livrée. Pour les marques établies souhaitant une visibilité maximale et une commission réduite de -2%, la Formule Pro est disponible à 49 000 Ar/mois sans engagement de durée."
        q2: "Comment et quand suis-je payé pour mes ventes ?"
        a2: "Vos reversements sont effectués de façon bi-hebdomadaire (tous les mardis et vendredis). L'argent est transféré directement sur votre compte MVola, Orange Money, Airtel Money ou par virement bancaire (BNI, BMOI, Société Générale Madagascar, etc.), déduction faite de la commission convenue."
        q3: "Qui prend en charge la livraison aux clients ?"
        a3: "GoBuy propose une solution logistique intégrée clé en main ! Dès qu'une commande est passée, vous recevez une notification pour préparer le colis. Un coursier GoBuy partenaire passe ensuite le récupérer à votre boutique ou domicile pour le livrer en 24h à Antananarivo ou en provinces. Si vous disposez déjà de votre propre flotte de livraison, vous pouvez également choisir de l'opérer directement."
        q4: "Faut-il obligatoirement une société immatriculée (NIF/STAT) ?"
        a4: "Non ! Les particuliers, créateurs, agriculteurs et artisans indépendants peuvent vendre sous la formule Standard avec une simple pièce d'identité (CIN valide). Pour les entreprises et distributeurs officiels, la soumission du NIF et STAT permet d'obtenir le badge officiel « Entreprise Vérifiée »."
        q5: "En quoi consiste le programme « Reconstruisons Ensemble 🤝 » ?"
        a5: "Ce programme spécial de relance solidaire a été conçu pour soutenir les commerces et entreprises ayant subi des pillages, des dégradations ou des sinistres matériels. GoBuy leur offre une boutique complète, 100 000 MGA de publicité offerte, 1 m³ de stockage gratuit, un accompagnement commercial, des campagnes réseaux sociaux et une formation personnalisée au back-office."
    final:
        title: "Prêt à vendre sur GoBuy Madagascar ?"
        text: "Déposez votre dossier en 2 minutes. Notre équipe vous accompagne à chaque étape."
