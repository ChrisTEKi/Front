        a6_t: "Formación en tu back-office"
        a6_d: "Sesión guiada de puesta en marcha para ti y tus colaboradores."
    faq:
        title: "Preguntas frecuentes de los vendedores"
        subtitle: "Todo lo que necesitas saber antes de empezar en GoBuy"
        q1: "¿Cuánto cuesta abrir mi tienda en GoBuy?"
        a1: "Con el plan Estándar, el registro es 100 % gratuito y sin alquiler mensual (0 Ar/mes). Solo pagas una comisión cuando una venta se concluye y se entrega. Para las marcas consolidadas que buscan máxima visibilidad y una comisión reducida en un 2 %, el plan Pro está disponible por 49 000 Ar/mes sin compromiso de permanencia."
        q2: "¿Cómo y cuándo cobro mis ventas?"
        a2: "Los pagos se realizan dos veces por semana (todos los martes y viernes). El dinero se transfiere directamente a tu cuenta MVola, Orange Money o Airtel Money, o por transferencia bancaria (BNI, BMOI, Société Générale Madagascar, etc.), una vez deducida la comisión acordada."
        q3: "¿Quién se encarga de la entrega a los clientes?"
        a3: "¡GoBuy ofrece una solución logística integrada llave en mano! En cuanto se realiza un pedido, recibes una notificación para preparar el paquete. Un mensajero asociado de GoBuy lo recoge después en tu tienda o domicilio y lo entrega en 24 h en Antananarivo o en las provincias. Si ya dispones de tu propia flota de reparto, también puedes optar por gestionarla tú mismo."
        q4: "¿Es obligatoria una empresa registrada (NIF/STAT)?"
        a4: "¡No! Los particulares, creadores, agricultores y artesanos independientes pueden vender con el plan Estándar con un simple documento de identidad (CIN válido). Para las empresas y distribuidores oficiales, presentar el NIF y el STAT permite obtener la insignia oficial «Empresa verificada»."
        q5: "¿En qué consiste el programa «Reconstruyamos juntos 🤝»?"
        a5: "Este programa especial de reactivación solidaria se ha diseñado para apoyar a los comercios y empresas que han sufrido saqueos, destrozos o siniestros materiales. GoBuy les ofrece una tienda completa, 100 000 MGA de publicidad gratuita, 1 m³ de almacenamiento gratuito, acompañamiento comercial, campañas en redes sociales y formación personalizada en el back-office."
    final:
        title: "¿Listo para vender en GoBuy Madagascar?"
        text: "Presenta tu solicitud en 2 minutos. Nuestro equipo te acompaña en cada paso."
