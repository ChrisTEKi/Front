    faq:
        title: "Frequently asked questions from sellers"
        subtitle: "Everything you need to know before getting started on GoBuy"
        q1: "What does it cost to open my shop on GoBuy?"
        a1: "With the Standard plan, signing up is 100% free with no monthly rent (0 Ar/month). You only pay a commission when a sale is actually completed and delivered. For established brands wanting maximum visibility and a commission reduced by 2%, the Pro plan is available at 49,000 Ar/month with no minimum term."
        q2: "How and when do I get paid for my sales?"
        a2: "Payouts are made twice a week (every Tuesday and Friday). The money is transferred directly to your MVola, Orange Money or Airtel Money account, or by bank transfer (BNI, BMOI, Société Générale Madagascar, etc.), minus the agreed commission."
        q3: "Who handles delivery to customers?"
        a3: "GoBuy offers a turnkey integrated logistics solution! As soon as an order is placed, you get a notification to prepare the parcel. A partner GoBuy courier then collects it from your shop or home and delivers it within 24h in Antananarivo or the provinces. If you already have your own delivery fleet, you can also choose to run deliveries yourself."
        q4: "Do I need a registered company (NIF/STAT)?"
        a4: "No! Individuals, creators, farmers and independent craftspeople can sell under the Standard plan with just an ID document (valid CIN). For companies and official distributors, submitting the NIF and STAT earns the official “Verified Business” badge."
        q5: "What is the “Let's Rebuild Together 🤝” programme?"
        a5: "This special solidarity recovery programme was designed to support shops and businesses that suffered looting, vandalism or material damage. GoBuy offers them a complete shop, 100,000 MGA of free advertising, 1 m³ of free storage, sales support, social media campaigns and personalised back-office training."
    final:
        title: "Ready to sell on GoBuy Madagascar?"
        text: "Submit your application in 2 minutes. Our team supports you at every step."
        start: "Get started"
        whatsapp: "WhatsApp Support"
