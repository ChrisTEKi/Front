# =============================================================================
# doctrine_migrations.yaml — versionnement du schéma de la base.
#   php bin/console doctrine:migrations:migrate      applique les migrations
#   php bin/console doctrine:migrations:diff         génère une migration après un changement d'entité
# =============================================================================
doctrine_migrations:
    migrations_paths:
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
