# =============================================================================
# notifier.yaml — envoi de SMS (codes OTP) via une passerelle configurable.
# Pour changer de fournisseur SMS : installer son pont (symfony/xxx-notifier) et
# modifier TEXTER_DSN. Aucun code PHP à changer.
# =============================================================================
framework:
    notifier:
        texter_transports:
            main: '%env(TEXTER_DSN)%'
