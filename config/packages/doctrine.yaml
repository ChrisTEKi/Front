# =============================================================================
# doctrine.yaml — accès à PostgreSQL (DBAL) et mapping objet-relationnel (ORM).
# =============================================================================
doctrine:
    dbal:
        # Connexion PostgreSQL (voir DATABASE_URL dans .env).
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        # Les noms de colonnes sont en snake_case (full_name, created_at…).
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute               # le mapping est écrit dans les entités (#[ORM\...])
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # Base dédiée aux tests (gobuy_test), jamais la base de développement.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
