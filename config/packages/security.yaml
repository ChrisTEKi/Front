# =============================================================================
# security.yaml — authentification, hachage des mots de passe, contrôle d'accès.
#
# PRINCIPE DE CONNEXION GOBUY
# ---------------------------
# Un utilisateur n'est "connecté" (jeton Symfony créé) qu'une fois TOUTES les étapes exigées franchies :
# mot de passe correct → e-mail/téléphone vérifié → (2FA si activée) → éventuellement restauration du compte.
# Ces étapes sont pilotées par App\Auth\LoginFlow (état dans la session). Le dernier geste est un appel
# à Security::login() avec l'authentificateur App\Security\FlowAuthenticator ci-dessous.
# Résultat : aucun utilisateur « à moitié connecté » n'existe jamais côté Symfony.
# =============================================================================
security:
    # --- Hachage des mots de passe : Argon2id (via libsodium), lauréat du concours Password Hashing Competition.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            time_cost: 4         # nombre d'itérations
            memory_cost: 65536   # 64 Mio de mémoire par hachage (rend les attaques GPU très coûteuses)

    # --- D'où viennent les utilisateurs : la table `users`, retrouvés par e-mail.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # --- Hiérarchie des rôles : un Super Admin possède aussi tous les droits d'un Admin.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    firewalls:
        # Outils de développement et fichiers statiques : pas de sécurité (sinon la barre de debug est bloquée).
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true                    # la session n'est lue que si une page a besoin de l'utilisateur
            provider: app_user_provider
            custom_authenticators:
                - App\Security\FlowAuthenticator
            # Dernier garde-fou (compte suspendu / non vérifié), indépendant de LoginFlow : voir App\Security\UserChecker.
            user_checker: App\Security\UserChecker
            # Que faire quand un visiteur NON connecté ouvre une page protégée : le rediriger vers /connexion.
            entry_point: App\Security\LoginEntryPoint
            # Déconnexion : lien généré par {{ logout_path() }} (contient un jeton CSRF → pas de déconnexion forcée par un tiers).
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true

    # --- Contrôle d'accès par URL (la première règle qui correspond s'applique).
    access_control:
        # L'invitation d'un nouvel admin est ouverte (le jeton du lien fait foi) : elle doit précéder la règle /admin.
        - { path: '^/admin/invitation', roles: PUBLIC_ACCESS }
        # Tout /admin exige d'être administrateur (les droits fins sont vérifiés dans chaque contrôleur).
        - { path: '^/admin', roles: ROLE_ADMIN }
        # Espace fournisseur.
        - { path: '^/fournisseur', roles: ROLE_SUPPLIER }
        # Espace client : compte, commande, paiement, suivi. (Le catalogue, le panier et les pages d'info restent PUBLICS.)
        - { path: '^/commande', roles: ROLE_CLIENT }
        - { path: '^/paiement', roles: ROLE_CLIENT }
        - { path: '^/compte', roles: ROLE_USER }
        - { path: '^/profil', roles: ROLE_USER }   # photo de profil de la personne connectée
        - { path: '^/suivi', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coûts minimaux pour que les tests restent rapides (NE JAMAIS faire ça en production).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
