# =============================================================================
# ux_icons.yaml — icônes Tabler : {{ ux_icon('tabler:nom') }}.
#
# Les 80 icônes utilisées par le site sont VERSIONNÉES dans assets/icons/tabler/*.svg : elles s'affichent
# sans aucun appel réseau (ni en développement, ni en production, même hors ligne).
#
# Ajouter une nouvelle icône : l'utiliser dans un gabarit puis lancer
#     php bin/console ux:icons:lock
# (télécharge depuis Iconify les icônes manquantes et les enregistre dans assets/icons/).
# =============================================================================
ux_icons:
    # Ne casse pas une page si une icône est introuvable (affiche simplement rien).
    ignore_not_found: true

when@prod:
    ux_icons:
        # En production : jamais de téléchargement à la volée (lenteur, panne réseau, dépendance externe).
        iconify:
            enabled: false
